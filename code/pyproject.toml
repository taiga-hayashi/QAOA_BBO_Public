[project]
name = "fmqa-categorical-experiments"
version = "0.1.0"
description = "Self-contained FMQA and XY-QAOA experiments for categorical problems"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "dimod>=0.12",
    "dwave-neal>=0.6",
    "openqarp",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "ipykernel",
]

[tool.uv]
package = false
